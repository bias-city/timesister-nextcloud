# Claude in the update path (anthropics/claude-code-action, major version v1).
# Runs on issues with label nc-update, on "@claude" in comments, and when
# the early warning calls it. Off as long as the secret ANTHROPIC_API_KEY
# is missing. Creates nothing but a branch and a pull request.
# SPDX-License-Identifier: AGPL-3.0-or-later

name: Claude

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_call:
    inputs:
      issue_number:
        type: number
        required: true
      version:
        type: string
        required: true
    secrets:
      ANTHROPIC_API_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: claude-${{ inputs.issue_number || github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  gate:
    # Only in the app's repo; only when it's really about Claude (saves minutes).
    if: >-
      github.repository == 'bias-city/timesister-nextcloud' && (
        inputs.issue_number ||
        (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'nc-update')) ||
        (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.k.outputs.enabled }}
    steps:
      - id: k
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "::notice::Claude is off: secret ANTHROPIC_API_KEY is missing."; fi

  claude:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # So Claude can run psalm, PHPUnit and tools/*.sh itself.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      - run: composer install --no-interaction --no-progress

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: nc-update
          trigger_phrase: '@claude'
          # Call from the early warning: a fixed task. Otherwise empty, then the issue applies.
          prompt: >-
            ${{ inputs.issue_number && format('Read UPDATE.md and bring the app to Nextcloud {0}. Based on issue #{1}. Work through the checklist, run composer run psalm:all and composer run test:unit, and open a pull request that closes issue #{1}.', inputs.version, inputs.issue_number) || '' }}
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(composer:*),Bash(php:*),Bash(bash tools/*),Bash(tools/*),Bash(vendor/bin/*),Bash(git:*),Bash(gh pr:*),Bash(gh issue:*)"
