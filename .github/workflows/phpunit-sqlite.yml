# After Nextcloud's template phpunit-sqlite (github.com/nextcloud/.github, workflow-templates).
# Kept lean for a private repo: only the smallest and largest version from
# info.xml, only on pull requests and pushes to main. Then the integration
# check (tests/integration) against the same server with SQLite and `php -S`.
# SPDX-FileCopyrightText: 2022-2024 Nextcloud GmbH and Nextcloud contributors
# SPDX-License-Identifier: MIT

name: PHPUnit SQLite

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phpunit-sqlite-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  APP_NAME: timesister

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get version matrix
        id: versions
        uses: nextcloud-libraries/nextcloud-version-matrix@cd0211ffcef1065e2020cd579e4843b8746e7a58 # v1.3.3

      - name: Only min and max
        id: pick
        env:
          MIN: ${{ steps.versions.outputs.branches-min }}
          MAX: ${{ steps.versions.outputs.branches-max }}
          PHP_MIN: ${{ steps.versions.outputs.php-min }}
          PHP_MAX: ${{ steps.versions.outputs.php-available }}
        run: |
          echo "matrix=$(jq -cn --arg a "$MIN" --arg b "$MAX" --arg p "$PHP_MIN" --arg q "$PHP_MAX" \
            '{include: ([{server: $a, php: $p}, {server: $b, php: $q}] | unique_by(.server))}')" >> "$GITHUB_OUTPUT"

  phpunit-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}

    name: SQLite PHP ${{ matrix.php }} Nextcloud ${{ matrix.server }}

    steps:
      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          repository: nextcloud/server
          ref: ${{ matrix.server }}

      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: apps/${{ env.APP_NAME }}

      # The server repository ships without the notifications app; the
      # integration tests check the reminders TimeSister sends through it.
      - name: Checkout notifications app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: nextcloud/notifications
          ref: ${{ matrix.server }}
          path: apps/notifications

      - name: Set up php ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          coverage: none
          ini-file: development
          # Backups up to 20 MB arrive as base64 in JSON (≈ 27 MB).
          ini-values: disable_functions=, post_max_size=64M, upload_max_filesize=64M, memory_limit=1G
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove nextcloud/ocp
        working-directory: apps/${{ env.APP_NAME }}
        run: composer remove nextcloud/ocp --dev --no-scripts

      - name: Install composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: apps/${{ env.APP_NAME }}

      - name: Set up Nextcloud
        run: |
          mkdir data
          ./occ maintenance:install --database=sqlite --database-name=nextcloud --admin-user admin --admin-pass admin
          ./occ app:enable notifications
          ./occ app:enable --force ${{ env.APP_NAME }}
          ./occ config:system:set trusted_domains 1 --value=127.0.0.1

      - name: PHPUnit
        working-directory: apps/${{ env.APP_NAME }}
        run: composer run test:unit

      - name: Run Nextcloud
        run: |
          php -S 127.0.0.1:8080 > php-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/status.php >/dev/null && break; sleep 1; done

      - name: Integration
        working-directory: apps/${{ env.APP_NAME }}
        env:
          NC_URL: http://127.0.0.1:8080
          NC_ADMIN_PASS: admin
          TS_SQL: sqlite3 ${{ github.workspace }}/data/nextcloud.db
        run: composer run test:integration

      - name: Print logs
        if: failure()
        run: tail -n 200 data/nextcloud.log

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: phpunit-sqlite
    if: always()
    name: phpunit-sqlite-summary
    steps:
      - name: Summary status
        run: if ${{ needs.phpunit-sqlite.result != 'success' }}; then exit 1; fi
